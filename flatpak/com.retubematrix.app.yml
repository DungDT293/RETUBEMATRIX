id: com.retubematrix.app
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: retubematrix

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=/run/media
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop
  - --own-name=org.com_retubematrix_app.SingleInstance

modules:
  - name: retubematrix
    buildsystem: simple
    sources:
      - type: dir
        path: payload
    build-commands:
      - cp -a usr/. /app/
      - |
        if [ -x /app/bin/RETubeMatrix ] && [ ! -f /app/bin/retubematrix ]; then
          ln -s /app/bin/RETubeMatrix /app/bin/retubematrix
        fi
      - |
        set -eu
        DESKTOP_FILE="$(find /app/share/applications -maxdepth 1 -type f -name '*.desktop' | sort | head -n 1)"
        if [ -z "$DESKTOP_FILE" ]; then
          echo "No desktop file found in deb package."
          exit 1
        fi

        install -Dm644 "$DESKTOP_FILE" /app/share/applications/com.retubematrix.app.desktop
        sed -i \
          -e 's|^Exec=.*|Exec=retubematrix %U|g' \
          -e 's|^Icon=.*|Icon=com.retubematrix.app|g' \
          /app/share/applications/com.retubematrix.app.desktop

        if grep -q '^MimeType=' /app/share/applications/com.retubematrix.app.desktop; then
          sed -i 's|^MimeType=.*|MimeType=x-scheme-handler/retubematrix;|g' /app/share/applications/com.retubematrix.app.desktop
        else
          printf '\nMimeType=x-scheme-handler/retubematrix;\n' >> /app/share/applications/com.retubematrix.app.desktop
        fi

        if ! grep -q '^Categories=' /app/share/applications/com.retubematrix.app.desktop; then
          printf 'Categories=AudioVideo;Video;Network;\n' >> /app/share/applications/com.retubematrix.app.desktop
        fi
      - |
        set -eu
        find /app/share/icons/hicolor -type f -path '*/apps/retubematrix.png' | while read -r ICON; do
          RELATIVE_ICON="${ICON#/app/share/icons/hicolor/}"
          TARGET_ICON="${RELATIVE_ICON%/retubematrix.png}/com.retubematrix.app.png"
          install -Dm644 "$ICON" "/app/share/icons/hicolor/$TARGET_ICON"
        done

        if ! find /app/share/icons/hicolor -type f -path '*/apps/com.retubematrix.app.png' | grep -q .; then
          echo "No application icon found in deb package."
          exit 1
        fi
